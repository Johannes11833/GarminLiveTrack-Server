name: PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        id: lint
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          requireScope: false

      - name: Explain invalid title
        if: always() && steps.lint.outputs.error_message != null
        uses: marocchino/sticky-pull-request-comment@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: pr-title-lint
          message: |
            This pull request title doesn't follow the required Conventional Commits format.

            Please rename it to:

            ```
            <type>(<scope>): <description>
            ```

            `<scope>` is optional. For example:

            - `feat(viewer): add session sharing`
            - `fix(api): handle a missing tracking id`
            - `chore: update dependencies`

            The allowed types are: `build`, `chore`, `ci`, `docs`, `feat`, `fix`,
            `perf`, `refactor`, `revert`, `style`, and `test`.

            See the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/)
            for details.

            Validation error:

            ```
            ${{ steps.lint.outputs.error_message }}
            ```

      - name: Remove comment after title is fixed
        if: always() && steps.lint.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: pr-title-lint
          delete: true
